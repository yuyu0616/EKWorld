<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゆるすと！</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .flip-container {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .flip-panel {
            background-color: var(--white);
            border: 4px solid var(--text-color);
            border-radius: 20px;
            box-shadow: 6px 6px 0px var(--text-color);
            padding: 24px;
            box-sizing: border-box;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .flip-panel h2, .flip-panel h3 { margin-top: 0; }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }
        .input-group label {
            font-weight: 800;
            font-size: 16px;
        }
        .flip-input {
            padding: 12px 16px;
            border: 3px solid var(--text-color);
            border-radius: 12px;
            font-size: 18px;
            font-family: inherit;
            color: var(--text-color);
            box-sizing: border-box;
            width: 100%;
        }
        textarea.flip-input {
            resize: vertical;
            min-height: 90px;
            line-height: 1.5;
        }
        .flip-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 94, 126, 0.3);
        }
        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .row > .grow { flex: 1; min-width: 180px; }
        .btn-sm {
            padding: 10px 18px;
            font-size: 15px;
        }

        /* ルーム情報 */
        .room-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-weight: 800;
        }
        .room-bar .room-id { color: var(--primary); font-size: 20px; }
        .link-btn {
            background: none;
            border: none;
            color: #64748b;
            font-family: inherit;
            font-weight: 800;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
        }

        /* お題 */
        .question-display {
            background-color: var(--secondary);
            color: var(--white);
            padding: 16px 20px;
            border-radius: 16px;
            border: 3px solid var(--text-color);
            box-shadow: 4px 4px 0px var(--text-color);
            text-align: center;
        }
        .question-label { font-size: 14px; font-weight: 800; opacity: 0.9; }
        .question-text {
            font-size: 26px;
            font-weight: 900;
            margin-top: 4px;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .question-text.empty { opacity: 0.7; font-size: 18px; }

        /* 進捗 */
        .progress-text {
            text-align: center;
            font-weight: 800;
            color: #64748b;
            margin: 4px 0 12px;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* フリップカード */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .flip-card {
            perspective: 1000px;
            min-height: 170px;
            cursor: pointer;
            position: relative;
        }
        .flip-card.disabled { cursor: default; }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 170px;
            transition: transform 0.7s cubic-bezier(0.34, 1.4, 0.64, 1);
            transform-style: preserve-3d;
        }
        .flip-card.open .flip-card-inner { transform: rotateY(180deg); }
        .flip-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border: 4px solid var(--text-color);
            border-radius: 16px;
            box-shadow: 5px 5px 0px var(--text-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }
        .flip-back {
            background-color: var(--primary);
            background-image: repeating-linear-gradient(-45deg,
                transparent, transparent 12px,
                rgba(255,255,255,0.15) 12px, rgba(255,255,255,0.15) 24px);
            color: var(--white);
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .flip-back.waiting {
            background-color: #cbd5e1;
            color: #64748b;
        }
        .flip-back .mark {
            font-size: 52px;
            font-weight: 900;
            line-height: 1;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.15);
        }
        .flip-back .status { font-size: 14px; font-weight: 800; }
        .flip-front {
            background-color: var(--white);
            transform: rotateY(180deg);
        }
        .card-name {
            font-weight: 900;
            font-size: 15px;
            padding: 8px 12px;
            background-color: var(--accent);
            border-bottom: 3px solid var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }
        .flip-back .card-name {
            position: absolute;
            top: 0; left: 0; right: 0;
            color: var(--text-color);
        }
        .card-answer {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            font-size: 24px;
            font-weight: 900;
            text-align: center;
            word-break: break-word;
            white-space: pre-wrap;
            overflow-y: auto;
        }
        .card-answer.long { font-size: 17px; }
        .card-answer.empty { color: #94a3b8; font-size: 16px; }
        .me-badge {
            display: inline-block;
            font-size: 11px;
            background: var(--secondary);
            color: var(--white);
            border-radius: 20px;
            padding: 1px 8px;
            margin-left: 4px;
            vertical-align: middle;
        }
        .flip-card .hint {
            position: absolute;
            bottom: 8px; left: 0; right: 0;
            text-align: center;
            font-size: 12px;
            font-weight: 800;
            opacity: 0.85;
        }

        /* 自分の回答 */
        .my-answer-status {
            font-weight: 800;
            font-size: 14px;
            color: #16a34a;
            margin-top: 8px;
            min-height: 1em;
        }
        .my-answer-status.warn { color: #ef4444; }

        .sync-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 12px;
            font-weight: 800;
            background: var(--white);
            padding: 4px 10px;
            border-radius: 20px;
            border: 2px solid var(--text-color);
            opacity: 0.7;
            z-index: 10;
        }
        .sync-status.error { color: #ef4444; opacity: 1; }

        @media (max-width: 480px) {
            .cards-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
            .question-text { font-size: 20px; }
            .card-answer { font-size: 20px; }
            .flip-panel { padding: 18px; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← もどる</a>

    <div id="app">
        <h1>フリップ</h1>

        <div class="flip-container" id="flip-container"></div>
    </div>

    <!-- ロビー -->
    <template id="tpl-lobby">
        <div class="flip-panel">
            <h2 style="text-align:center; color: var(--primary);">ルームに入る</h2>
            <div class="input-group">
                <label for="playerName">あなたの名前</label>
                <input type="text" id="playerName" class="flip-input" maxlength="20" placeholder="例: スライム">
            </div>
            <div class="input-group">
                <label for="roomId">ルームID (合言葉)</label>
                <input type="text" id="roomId" class="flip-input" maxlength="30" placeholder="例: ゆるすと">
            </div>
            <button class="btn" id="join-btn" style="width: 100%; background-color: var(--primary);">入室する / 作成する</button>
        </div>
    </template>

    <!-- ルーム -->
    <template id="tpl-room">
        <div class="room-bar">
            <div>ルーム: <span class="room-id" id="display-room-id"></span></div>
            <div>あなた: <span id="display-name"></span> <button class="link-btn" id="leave-btn">退出</button></div>
        </div>

        <div class="question-display">
            <div class="question-label">お題 <span id="round-label"></span></div>
            <div class="question-text" id="display-question"></div>
        </div>

        <div class="flip-panel">
            <h3>お題を出す</h3>
            <div class="row">
                <input type="text" id="questionInput" class="flip-input grow" maxlength="100" placeholder="例: 好きな食べ物は？">
                <button class="btn btn-sm" id="set-question-btn" style="background-color: var(--secondary);">お題を設定</button>
            </div>
        </div>

        <div class="flip-panel">
            <h3>あなたの回答</h3>
            <textarea id="answerInput" class="flip-input" maxlength="200" placeholder="自由に入力してね"></textarea>
            <div class="row" style="margin-top: 12px;">
                <button class="btn grow" id="submit-btn" style="background-color: var(--primary);">回答を送信</button>
            </div>
            <div class="my-answer-status" id="my-answer-status"></div>
        </div>

        <div class="flip-panel">
            <h3>みんなのフリップ</h3>
            <div class="progress-text" id="progress-text"></div>
            <div class="controls">
                <button class="btn btn-sm" id="reveal-all-btn" style="background-color: var(--primary);">一斉にオープン！</button>
                <button class="btn btn-sm" id="hide-all-btn" style="background-color: #94a3b8;">全部ふせる</button>
                <button class="btn btn-sm" id="next-round-btn" style="background-color: var(--secondary);">次のお題へ（回答リセット）</button>
            </div>
            <p class="progress-text" style="font-size: 13px; margin-top: 12px;">カードをタップすると1人ずつオープンできます</p>
            <div class="cards-grid" id="cards-grid"></div>
        </div>
    </template>

    <div class="sync-status" id="sync-status">オフライン</div>

    <script src="flip.js"></script>
</body>
</html>
