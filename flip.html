<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゆるすと！</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .flip-container {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .flip-panel {
            background-color: var(--white);
            border: 4px solid var(--text-color);
            border-radius: 20px;
            box-shadow: 6px 6px 0px var(--text-color);
            padding: 24px;
            box-sizing: border-box;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .flip-panel h2, .flip-panel h3 { margin-top: 0; }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }
        .input-group label {
            font-weight: 800;
            font-size: 16px;
        }
        .flip-input {
            padding: 12px 16px;
            border: 3px solid var(--text-color);
            border-radius: 12px;
            font-size: 18px;
            font-family: inherit;
            color: var(--text-color);
            box-sizing: border-box;
            width: 100%;
        }
        textarea.flip-input {
            resize: vertical;
            min-height: 90px;
            line-height: 1.5;
        }
        .flip-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 94, 126, 0.3);
        }
        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .row > .grow { flex: 1; min-width: 180px; }
        .btn-sm {
            padding: 10px 18px;
            font-size: 15px;
        }

        /* ルーム情報 */
        .room-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-weight: 800;
        }
        .room-bar .room-id { color: var(--primary); font-size: 20px; }
        .link-btn {
            background: none;
            border: none;
            color: #64748b;
            font-family: inherit;
            font-weight: 800;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
        }

        /* お題 */
        .question-display {
            background-color: var(--secondary);
            color: var(--white);
            padding: 16px 20px;
            border-radius: 16px;
            border: 3px solid var(--text-color);
            box-shadow: 4px 4px 0px var(--text-color);
            text-align: center;
        }
        .question-label { font-size: 14px; font-weight: 800; opacity: 0.9; }
        .question-text {
            font-size: 26px;
            font-weight: 900;
            margin-top: 4px;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .question-text.empty { opacity: 0.7; font-size: 18px; }

        /* 進捗 */
        .progress-text {
            text-align: center;
            font-weight: 800;
            color: #64748b;
            margin: 4px 0 12px;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* フリップカード */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .flip-card {
            perspective: 1000px;
            min-height: 190px;
            cursor: pointer;
            position: relative;
        }
        .flip-card.disabled { cursor: default; }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 190px;
            transition: transform 0.7s cubic-bezier(0.34, 1.4, 0.64, 1);
            transform-style: preserve-3d;
        }
        .flip-card.open .flip-card-inner { transform: rotateY(180deg); }
        .flip-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border: 4px solid var(--text-color);
            border-radius: 16px;
            box-shadow: 5px 5px 0px var(--text-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }
        .flip-back {
            background-color: var(--primary);
            background-image: repeating-linear-gradient(-45deg,
                transparent, transparent 12px,
                rgba(255,255,255,0.15) 12px, rgba(255,255,255,0.15) 24px);
            color: var(--white);
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .flip-back.waiting {
            background-color: #cbd5e1;
            color: #64748b;
        }
        .flip-back .mark {
            font-size: 52px;
            font-weight: 900;
            line-height: 1;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.15);
        }
        .flip-back .status { font-size: 14px; font-weight: 800; }
        .flip-front {
            background-color: var(--white);
            transform: rotateY(180deg);
        }
        .card-name {
            font-weight: 900;
            font-size: 15px;
            padding: 8px 12px;
            background-color: var(--accent);
            border-bottom: 3px solid var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }
        .flip-back .card-name {
            position: absolute;
            top: 0; left: 0; right: 0;
            color: var(--text-color);
        }
        .card-answer {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            font-size: 24px;
            font-weight: 900;
            text-align: center;
            word-break: break-word;
            white-space: pre-wrap;
            overflow-y: auto;
        }
        .card-answer.long { font-size: 17px; }
        .card-answer { min-height: 0; }
        .card-answer.drawing { padding: 6px; overflow: hidden; }
        .drawing-svg { width: 100%; height: 100%; display: block; }

        /* 回答方法の切り替え */
        .mode-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .mode-tab {
            flex: 1;
            font-family: inherit;
            font-weight: 800;
            font-size: 16px;
            padding: 10px;
            border: 3px solid var(--text-color);
            border-radius: 12px;
            background: var(--white);
            color: var(--text-color);
            cursor: pointer;
        }
        .mode-tab.active {
            background: var(--accent);
            box-shadow: 3px 3px 0 var(--text-color);
        }
        .mode-tab:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 手書き */
        .draw-tools {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .tool-group { display: flex; gap: 6px; align-items: center; }
        .tool-sep { width: 2px; height: 28px; background: #e2e8f0; }
        .color-btn, .width-btn, .tool-btn {
            border: 3px solid var(--text-color);
            background: var(--white);
            cursor: pointer;
            font-family: inherit;
            font-weight: 800;
            color: var(--text-color);
        }
        .color-btn {
            width: 32px; height: 32px;
            border-radius: 50%;
            padding: 0;
        }
        .width-btn {
            width: 36px; height: 36px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            padding: 0;
        }
        .width-btn span { display: block; background: var(--text-color); border-radius: 50%; }
        .color-btn.active, .width-btn.active {
            outline: 3px solid var(--secondary);
            outline-offset: 2px;
        }
        .tool-btn {
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 14px;
        }
        .draw-tools button:disabled { opacity: 0.4; cursor: not-allowed; }
        .draw-canvas {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            border: 3px solid var(--text-color);
            border-radius: 12px;
            background: #fff;
            cursor: crosshair;
            box-sizing: border-box;
        }
        .draw-canvas.locked { cursor: not-allowed; opacity: 0.8; }
        .card-answer.empty { color: #94a3b8; font-size: 16px; }
        .me-badge {
            display: inline-block;
            font-size: 11px;
            background: var(--secondary);
            color: var(--white);
            border-radius: 20px;
            padding: 1px 8px;
            margin-left: 4px;
            vertical-align: middle;
        }
        .flip-card .hint {
            position: absolute;
            bottom: 8px; left: 0; right: 0;
            text-align: center;
            font-size: 12px;
            font-weight: 800;
            opacity: 0.85;
        }

        /* 自分の回答 */
        .my-answer-status {
            font-weight: 800;
            font-size: 14px;
            color: #16a34a;
            margin-top: 8px;
            min-height: 1em;
        }
        .my-answer-status.warn { color: #ef4444; }

        .sync-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 12px;
            font-weight: 800;
            background: var(--white);
            padding: 4px 10px;
            border-radius: 20px;
            border: 2px solid var(--text-color);
            opacity: 0.7;
            z-index: 10;
        }
        .sync-status.error { color: #ef4444; opacity: 1; }

        /* 画面遷移 */
        .steps {
            list-style: none;
            display: flex;
            gap: 6px;
            padding: 0;
            margin: 0;
        }
        .steps li {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 4px;
            border: 3px solid #cbd5e1;
            border-radius: 50px;
            background: var(--white);
            color: #94a3b8;
            font-weight: 800;
            font-size: 15px;
        }
        .steps .step-no {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px; height: 22px;
            border-radius: 50%;
            background: #cbd5e1;
            color: var(--white);
            font-size: 13px;
        }
        .steps li.done { color: var(--text-color); border-color: var(--text-color); }
        .steps li.done .step-no { background: var(--text-color); }
        .steps li.active {
            color: var(--text-color);
            border-color: var(--text-color);
            background: var(--accent);
            box-shadow: 3px 3px 0 var(--text-color);
        }
        .steps li.active .step-no { background: var(--primary); }
        .screen {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .screen[hidden] { display: none; }
        .screen.enter { animation: screenIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes screenIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: none; }
        }
        .screen-title { text-align: center; color: var(--primary); }
        .screen-note {
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            color: #64748b;
            margin: 12px 0 0;
        }
        .nav-links { text-align: center; margin-top: 8px; }
        .member-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .member-chip {
            padding: 6px 14px;
            border-radius: 50px;
            border: 2px solid var(--text-color);
            font-weight: 800;
            background: #f1f5f9;
            color: #94a3b8;
        }
        .member-chip.ok { background: var(--accent); color: var(--text-color); }
        .member-chip.me { border-color: var(--secondary); }

        @media (max-width: 480px) {
            .cards-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
            .question-text { font-size: 20px; }
            .card-answer { font-size: 20px; }
            .flip-panel { padding: 18px; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← もどる</a>

    <div id="app">
        <h1>フリップ</h1>

        <div class="flip-container" id="flip-container"></div>
    </div>

    <!-- ロビー -->
    <template id="tpl-lobby">
        <div class="flip-panel">
            <h2 style="text-align:center; color: var(--primary);">ルームに入る</h2>
            <div class="input-group">
                <label for="playerName">あなたの名前</label>
                <input type="text" id="playerName" class="flip-input" maxlength="20" placeholder="例: スライム">
            </div>
            <div class="input-group">
                <label for="roomId">ルームID (合言葉)</label>
                <input type="text" id="roomId" class="flip-input" maxlength="30" placeholder="例: ゆるすと">
            </div>
            <button class="btn" id="join-btn" style="width: 100%; background-color: var(--primary);">入室する / 作成する</button>
        </div>
    </template>

    <!-- ルーム -->
    <template id="tpl-room">
        <div class="room-bar">
            <div>ルーム: <span class="room-id" id="display-room-id"></span></div>
            <div>あなた: <span id="display-name"></span> <button class="link-btn" id="leave-btn">退出</button></div>
        </div>

        <ol class="steps" id="steps">
            <li data-stage="question"><span class="step-no">1</span>お題</li>
            <li data-stage="answer"><span class="step-no">2</span>回答</li>
            <li data-stage="reveal"><span class="step-no">3</span>フリップ</li>
        </ol>

        <!-- ① お題を出す画面 -->
        <section class="screen" id="screen-question" hidden>
            <div class="flip-panel">
                <h2 class="screen-title">第<span class="round-no"></span>問のお題を出そう</h2>
                <div class="input-group">
                    <label for="questionInput">お題</label>
                    <input type="text" id="questionInput" class="flip-input" maxlength="100" placeholder="例: 好きな食べ物は？">
                </div>
                <button class="btn" id="set-question-btn" style="width: 100%; background-color: var(--secondary);">このお題で回答スタート！</button>
                <p class="screen-note">お題を決めると、全員が回答画面に進みます</p>
            </div>
            <div class="flip-panel">
                <h3>参加しているメンバー（<span id="member-count"></span>人）</h3>
                <ul class="member-list" id="member-list"></ul>
            </div>
        </section>

        <!-- ② 回答画面 -->
        <section class="screen" id="screen-answer" hidden>
            <div class="question-display">
                <div class="question-label">お題 (第<span class="round-no"></span>問)</div>
                <div class="question-text" id="answer-question"></div>
            </div>

            <div class="flip-panel">
                <h3>あなたの回答</h3>
                <div class="mode-tabs" id="mode-tabs">
                    <button type="button" class="mode-tab" data-mode="text">⌨ テキスト</button>
                    <button type="button" class="mode-tab" data-mode="draw">✏ 手書き</button>
                </div>
                <div id="text-area">
                    <textarea id="answerInput" class="flip-input" maxlength="200" placeholder="自由に入力してね"></textarea>
                </div>
                <div id="draw-area" hidden>
                    <div class="draw-tools">
                        <div class="tool-group" id="color-tools"></div>
                        <div class="tool-sep"></div>
                        <div class="tool-group" id="width-tools"></div>
                        <div class="tool-sep"></div>
                        <div class="tool-group">
                            <button type="button" class="tool-btn" id="undo-btn">↶ 戻す</button>
                            <button type="button" class="tool-btn" id="clear-btn">🗑 全部消す</button>
                        </div>
                    </div>
                    <canvas id="drawCanvas" class="draw-canvas"></canvas>
                </div>
                <div class="row" style="margin-top: 12px;">
                    <button class="btn grow" id="submit-btn" style="background-color: var(--primary);">回答を送信</button>
                </div>
                <div class="my-answer-status" id="my-answer-status"></div>
            </div>

            <div class="flip-panel">
                <h3>回答状況</h3>
                <div class="progress-text" id="answer-progress"></div>
                <ul class="member-list" id="answer-members"></ul>
                <button class="btn" id="go-reveal-btn" style="width: 100%; margin-top: 16px; background-color: #f59e0b;">みんなのフリップへ →</button>
                <div class="nav-links">
                    <button class="link-btn" id="back-question-btn">← お題を変更する</button>
                </div>
            </div>
        </section>

        <!-- ③ みんなのフリップ画面 -->
        <section class="screen" id="screen-reveal" hidden>
            <div class="question-display">
                <div class="question-label">お題 (第<span class="round-no"></span>問)</div>
                <div class="question-text" id="reveal-question"></div>
            </div>

            <div class="flip-panel">
                <h3>みんなのフリップ</h3>
                <div class="progress-text" id="progress-text"></div>
                <div class="controls">
                    <button class="btn btn-sm" id="reveal-all-btn" style="background-color: var(--primary);">一斉にオープン！</button>
                    <button class="btn btn-sm" id="hide-all-btn" style="background-color: #94a3b8;">全部ふせる</button>
                </div>
                <p class="progress-text" style="font-size: 13px; margin-top: 12px;">カードをタップすると1人ずつオープンできます</p>
                <div class="cards-grid" id="cards-grid"></div>
            </div>

            <button class="btn" id="next-round-btn" style="width: 100%; background-color: var(--secondary);">次のお題へ →</button>
            <div class="nav-links">
                <button class="link-btn" id="back-answer-btn">← 回答画面にもどる</button>
            </div>
        </section>
    </template>

    <div class="sync-status" id="sync-status">オフライン</div>

    <script src="flip_merge.js"></script>
    <script src="flip_draw.js"></script>
    <script src="flip.js"></script>
</body>
</html>
