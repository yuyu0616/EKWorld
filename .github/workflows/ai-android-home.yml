name: AI Android Home - build APK

on:
  push:
    paths:
      - "ai-android-home/**"
      - ".github/workflows/ai-android-home.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-android-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ai-android-home-debug-apk
          path: ai-android-home/app/build/outputs/apk/debug/*.apk
